<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#5229D3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>ApplyHQ</title>
    <link rel="stylesheet" href="css/style.css">

<body>
    <input class="sidebar-toggle" id="sidebar-toggle" type="checkbox" aria-hidden="true">
    <label class="sidebar-menu-button" for="sidebar-toggle" aria-label="Menü öffnen">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <aside class="app-sidebar" aria-label="Hauptnavigation">
        <div id="main-logo">
            <img src="assets/icons/ApplyHQ_Icon_large.png" alt="">
            <span>ApplyHQ</span>
        </div>

        <div class="navigation">
            <nav aria-label="Primär">
                <ul class="navbar">
                    <li>
                        <a class="navbar-button" href="#dashboard" data-view="dashboard" data-action="loadDashboard">
                            <img src="assets/icons/icon_home.svg" alt="">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="navbar-button is-disabled" href="#" aria-disabled="true" tabindex="-1">
                            <img src="assets/icons/icon_notes.svg" alt="">
                            <span>Dokumente</span>
                        </a>
                    </li>
                    <li>
                        <a class="navbar-button" href="#profile" data-view="profile" data-action="loadProfile">
                            <img src="assets/icons/icon_person.svg" alt="">
                            <span>Profil</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <nav aria-label="Einstellungen">
                <ul class="navbar navbar-bottom">
                    <li>
                        <a id="navbar-settings" class="navbar-button" href="#settings" data-view="settings" data-action="loadSettings">
                            <img src="assets/icons/icon_gears.svg" alt="">
                            <span>Einstellungen</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <label class="sidebar-backdrop" for="sidebar-toggle" aria-label="Menü schließen"></label>

    <div class="app-content">
        <main id="app" aria-live="polite"></main>
    </div>

    <script src="js/applicationModel.js"></script>

    <script src="js/config.js"></script>
    <script src="js/searchJobs.js"></script>
    <script src="js/searchProfileCards.js"></script>
    <script src="js/profileModel.js"></script>
